name: Preparar projecto Morphe

on:
  push:
    paths:
      - smartlauncher-force60-project.zip
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extrair projecto e criar commit
        run: |
          unzip -o smartlauncher-force60-project.zip
          rm -f smartlauncher-force60-project.zip
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adicionar patch Smart Launcher Force 60 Hz"
          git push
