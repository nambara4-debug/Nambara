name: Compilar Force 60 Hz

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extrair projecto
        run: unzip -o smartlauncher-force60-project.zip

      - name: Compilar patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Guardar ficheiro MPP
        uses: actions/upload-artifact@v4
        with:
          name: smartlauncher-force60-mpp
          path: patches/build/libs/*.mpp
