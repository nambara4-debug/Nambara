name: Compilar patch Discord 346 - 720p bitrate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/discord346_720p_bitrate.yml"

permissions:
  contents: read
  packages: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter base Morphe
        uses: actions/checkout@v4
        with:
          repository: arandomhooman/hoomans-morphe-patches
          ref: 018277825a611ad61f3a16a70e562291c06f4081
          path: morphe-base

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Criar patches Discord 346
        shell: bash
        run: |
          rm -rf morphe-base/patches/src/main/kotlin
          mkdir -p morphe-base/patches/src/main/kotlin/nambara/morphe/patches/discord

          cat > morphe-base/patches/src/main/kotlin/nambara/morphe/patches/discord/Discord346Patches.kt <<'KOTLIN'
          package nambara.morphe.patches.discord

          import app.morphe.patcher.extensions.InstructionExtensions.addInstructionsWithLabels
          import app.morphe.patcher.extensions.InstructionExtensions.getInstruction
          import app.morphe.patcher.patch.AppTarget
          import app.morphe.patcher.patch.Compatibility
          import app.morphe.patcher.patch.PatchException
          import app.morphe.patcher.patch.bytecodePatch
          import app.morphe.patcher.patch.rawResourcePatch
          import app.morphe.patcher.util.smali.ExternalLabel

          private val discord346Compatibility = Compatibility(
              name = "Discord",
              packageName = "com.discord",
              appIconColor = 0x5865F2,
              targets = listOf(
                  AppTarget("346.13 - Stable"),
                  AppTarget("346.13"),
              ),
          )

          private const val DISCORD_VIDEO_ENCODER_FACTORY =
              "Lco/discord/media_engine/DiscordVideoEncoderFactory;"

          private fun int32Le(value: Int): ByteArray = byteArrayOf(
              value.toByte(),
              (value ushr 8).toByte(),
              (value ushr 16).toByte(),
              (value ushr 24).toByte(),
          )

          private fun int64Le(value: Long): ByteArray = byteArrayOf(
              value.toByte(),
              (value ushr 8).toByte(),
              (value ushr 16).toByte(),
              (value ushr 24).toByte(),
              (value ushr 32).toByte(),
              (value ushr 40).toByte(),
              (value ushr 48).toByte(),
              (value ushr 56).toByte(),
          )

          private fun videoTier(
              width: Int,
              height: Int,
              layers: Int,
              maxBitrate: Long,
              targetBitrate: Long,
              minBitrate: Long,
          ): ByteArray =
              int32Le(width) +
                  int32Le(height) +
                  int32Le(layers) +
                  int32Le(0) +
                  int64Le(maxBitrate) +
                  int64Le(targetBitrate) +
                  int64Le(minBitrate)

          // Exact native video-quality table in Discord 346.13 arm64.
          private val tier1080p = videoTier(
              width = 1920,
              height = 1080,
              layers = 3,
              maxBitrate = 5_000_000,
              targetBitrate = 4_000_000,
              minBitrate = 800_000,
          )

          private val tier720pStock = videoTier(
              width = 1280,
              height = 720,
              layers = 3,
              maxBitrate = 2_500_000,
              targetBitrate = 2_500_000,
              minBitrate = 600_000,
          )

          private val tier540p = videoTier(
              width = 960,
              height = 540,
              layers = 3,
              maxBitrate = 1_200_000,
              targetBitrate = 1_200_000,
              minBitrate = 350_000,
          )

          // First test for mobile data:
          // keep 1280x720/30 and only raise the 720p bitrate envelope.
          private val tier720pBoost = videoTier(
              width = 1280,
              height = 720,
              layers = 3,
              maxBitrate = 4_000_000,
              targetBitrate = 3_500_000,
              minBitrate = 600_000,
          )

          private val nativeTierSignature =
              tier1080p + tier720pStock + tier540p

          private fun ByteArray.findUnique(pattern: ByteArray, label: String): Int? {
              var found: Int? = null
              val last = size - pattern.size
              if (last < 0) return null

              outer@ for (i in 0..last) {
                  for (j in pattern.indices) {
                      if (this[i + j] != pattern[j]) continue@outer
                  }

                  if (found != null) {
                      throw PatchException(
                          "Discord 346.13: $label matched more than once.",
                      )
                  }
                  found = i
              }
              return found
          }

          @Suppress("unused")
          val fixMediaTekSecureHevcEncoderPatch = bytecodePatch(
              name = "Fix MediaTek video calls (Discord 346.13)",
              description = "Blocks c2.mtk.hevc.encoder.secure so Discord falls back to H.264/AVC.",
          ) {
              compatibleWith(discord346Compatibility)

              execute {
                  val encoderFactory = classDefByStrings(
                      "c2.mtk.hevc.encoder",
                  ).singleOrNull { classDef ->
                      classDef.type == DISCORD_VIDEO_ENCODER_FACTORY
                  } ?: throw PatchException(
                      "Discord 346.13: DiscordVideoEncoderFactory was not found.",
                  )

                  val mutableEncoderFactory = mutableClassDefBy(encoderFactory)

                  val codecFilter = mutableEncoderFactory.methods.singleOrNull { method ->
                      method.name == "lambda\$new\$0" &&
                          method.returnType == "Z" &&
                          method.parameterTypes.size == 1 &&
                          method.parameterTypes[0].toString() == "Landroid/media/MediaCodecInfo;"
                  } ?: throw PatchException(
                      "Discord 346.13: encoder filter lambda was not found or was ambiguous.",
                  )

                  codecFilter.addInstructionsWithLabels(
                      0,
                      """
                          invoke-virtual {p0}, Landroid/media/MediaCodecInfo;->getName()Ljava/lang/String;
                          move-result-object v0
                          const-string v1, "c2.mtk.hevc.encoder.secure"
                          invoke-virtual {v1, v0}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
                          move-result v0
                          if-eqz v0, :original
                          const/4 v0, 0x0
                          return v0
                      """,
                      ExternalLabel("original", codecFilter.getInstruction(0)),
                  )
              }
          }

          @Suppress("unused")
          val boost720pBitratePatch = rawResourcePatch(
              name = "Boost 720p bitrate to 3.5-4 Mbps (Discord 346.13)",
              description = "Keeps 1280x720 and raises Discord's native 720p target bitrate from 2.5 to 3.5 Mbps and max bitrate to 4.0 Mbps. Experimental.",
          ) {
              dependsOn(fixMediaTekSecureHevcEncoderPatch)
              compatibleWith(discord346Compatibility)

              execute {
                  val libPath = "lib/arm64-v8a/libdiscord.so"
                  val lib = get(libPath)

                  if (!lib.exists()) {
                      throw PatchException(
                          "$libPath was not found. Use the arm64 Discord 346.13 package/splits so Morphe includes libdiscord.so.",
                      )
                  }

                  val bytes = lib.readBytes()
                  val match = bytes.findUnique(
                      nativeTierSignature,
                      "native 1080p/720p/540p video-quality table",
                  ) ?: throw PatchException(
                      "Discord 346.13: native video-quality table was not found. This patch is pinned to the arm64 346.13 build.",
                  )

                  val tier720Offset = match + tier1080p.size

                  // Safety check: only patch if the exact stock 720p entry is still present.
                  for (i in tier720pStock.indices) {
                      if (bytes[tier720Offset + i] != tier720pStock[i]) {
                          throw PatchException(
                              "Discord 346.13: stock 720p tier did not match at the expected offset.",
                          )
                      }
                  }

                  tier720pBoost.copyInto(
                      bytes,
                      destinationOffset = tier720Offset,
                  )
                  lib.writeBytes(bytes)
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path("morphe-base/patches/build.gradle.kts")
          s = p.read_text()
          s = s.replace('group = "io.github.arandomhooman"', 'group = "io.github.nambara4debug"')
          s = s.replace('name = "Hooman\'s Morphe Patches"', 'name = "Nambara Discord 720p Quality Test"')
          s = s.replace('description = "Personal Morphe patches for paid Android apps."', 'description = "Correcção MediaTek e teste 720p com bitrate superior no Discord 346.13."')
          s = s.replace('author = "arandomhooman"', 'author = "nambara4-debug"')
          s = s.replace('website = "https://github.com/arandomhooman/hoomans-morphe-patches"', 'website = "https://github.com/nambara4-debug/Nambara"')
          p.write_text(s)
          PY

          sed -i -E 's/^version = .*/version = 1.3.0/' morphe-base/gradle.properties

      - name: Compilar MPP
        working-directory: morphe-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Guardar MPP
        uses: actions/upload-artifact@v4
        with:
          name: discord-346-720p-bitrate-mpp
          path: morphe-base/patches/build/libs/*.mpp
          if-no-files-found: error
