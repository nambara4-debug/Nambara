name: Compilar patch Discord 346 - Câmara MediaTek + 1080p

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/discord346_1080p.yml"

permissions:
  contents: read
  packages: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter base Morphe
        uses: actions/checkout@v4
        with:
          repository: arandomhooman/hoomans-morphe-patches
          ref: 018277825a611ad61f3a16a70e562291c06f4081
          path: morphe-base

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Criar patches Discord 346
        shell: bash
        run: |
          rm -rf morphe-base/patches/src/main/kotlin
          mkdir -p morphe-base/patches/src/main/kotlin/nambara/morphe/patches/discord

          cat > morphe-base/patches/src/main/kotlin/nambara/morphe/patches/discord/Discord346Patches.kt <<'KOTLIN'
          package nambara.morphe.patches.discord

          import app.morphe.patcher.extensions.InstructionExtensions.addInstructionsWithLabels
          import app.morphe.patcher.extensions.InstructionExtensions.getInstruction
          import app.morphe.patcher.patch.AppTarget
          import app.morphe.patcher.patch.Compatibility
          import app.morphe.patcher.patch.PatchException
          import app.morphe.patcher.patch.bytecodePatch
          import app.morphe.patcher.util.smali.ExternalLabel

          private val discord346Compatibility = Compatibility(
              name = "Discord",
              packageName = "com.discord",
              appIconColor = 0x5865F2,
              targets = listOf(
                  AppTarget("346.13 - Stable"),
                  AppTarget("346.13"),
              ),
          )

          private const val DISCORD_VIDEO_ENCODER_FACTORY =
              "Lco/discord/media_engine/DiscordVideoEncoderFactory;"

          private const val VIDEO_COMPRESSION_QUALITY =
              "Lcom/discord/media/utils/VideoCompressionQuality;"

          @Suppress("unused")
          val fixMediaTekSecureHevcEncoderPatch = bytecodePatch(
              name = "Fix MediaTek video calls (Discord 346.13)",
              description = "Blocks c2.mtk.hevc.encoder.secure so Discord can fall back to a compatible hardware encoder such as H.264/AVC.",
          ) {
              compatibleWith(discord346Compatibility)

              execute {
                  val encoderFactory = classDefByStrings(
                      "c2.mtk.hevc.encoder",
                  ).singleOrNull { classDef ->
                      classDef.type == DISCORD_VIDEO_ENCODER_FACTORY
                  } ?: throw PatchException(
                      "Discord 346.13: DiscordVideoEncoderFactory was not found.",
                  )

                  val mutableEncoderFactory = mutableClassDefBy(encoderFactory)

                  val codecFilter = mutableEncoderFactory.methods.singleOrNull { method ->
                      method.name == "lambda\$new\$0" &&
                          method.returnType == "Z" &&
                          method.parameterTypes.size == 1 &&
                          method.parameterTypes[0].toString() == "Landroid/media/MediaCodecInfo;"
                  } ?: throw PatchException(
                      "Discord 346.13: encoder filter lambda was not found or was ambiguous.",
                  )

                  codecFilter.addInstructionsWithLabels(
                      0,
                      """
                          invoke-virtual {p0}, Landroid/media/MediaCodecInfo;->getName()Ljava/lang/String;
                          move-result-object v0
                          const-string v1, "c2.mtk.hevc.encoder.secure"
                          invoke-virtual {v1, v0}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
                          move-result v0
                          if-eqz v0, :original
                          const/4 v0, 0x0
                          return v0
                      """,
                      ExternalLabel("original", codecFilter.getInstruction(0)),
                  )
              }
          }

          @Suppress("unused")
          val force1080p30HighQualityPatch = bytecodePatch(
              name = "Force 1080p30 high quality (Discord 346.13)",
              description = "Changes Discord's internal High video preset from 720p / 2.5 Mbps to 1080p / 7 Mbps. Experimental.",
          ) {
              compatibleWith(discord346Compatibility)

              execute {
                  val qualityClass = classDefByStrings(
                      "VeryHigh",
                      "High",
                      "Medium",
                      "Low",
                      "VeryLow",
                  ).singleOrNull { classDef ->
                      classDef.type == VIDEO_COMPRESSION_QUALITY
                  } ?: throw PatchException(
                      "Discord 346.13: VideoCompressionQuality was not found.",
                  )

                  val mutableQualityClass = mutableClassDefBy(qualityClass)

                  val constructor = mutableQualityClass.methods.singleOrNull { method ->
                      method.name == "<init>" &&
                          method.returnType == "V" &&
                          method.parameterTypes.map { it.toString() } == listOf(
                              "Ljava/lang/String;",
                              "I",
                              "Ljava/lang/String;",
                              "I",
                              "I",
                          )
                  } ?: throw PatchException(
                      "Discord 346.13: VideoCompressionQuality constructor was not found or was ambiguous.",
                  )

                  // The constructor has no local registers. After its first instruction
                  // (Enum.<init>(name, ordinal)), p2 is no longer needed and can safely
                  // be used as a temporary register.
                  constructor.addInstructionsWithLabels(
                      1,
                      """
                          const-string p2, "High"
                          invoke-virtual {p2, p1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
                          move-result p2
                          if-eqz p2, :original
                          const/16 p4, 0x438
                          const p5, 0x006acfc0
                      """,
                      ExternalLabel("original", constructor.getInstruction(1)),
                  )
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path("morphe-base/patches/build.gradle.kts")
          s = p.read_text()
          s = s.replace('group = "io.github.arandomhooman"', 'group = "io.github.nambara4debug"')
          s = s.replace('name = "Hooman\'s Morphe Patches"', 'name = "Nambara Discord Camera Experiments"')
          s = s.replace('description = "Personal Morphe patches for paid Android apps."', 'description = "Correcção MediaTek e teste experimental 1080p30 para Discord 346.13."')
          s = s.replace('author = "arandomhooman"', 'author = "nambara4-debug"')
          s = s.replace('website = "https://github.com/arandomhooman/hoomans-morphe-patches"', 'website = "https://github.com/nambara4-debug/Nambara"')
          p.write_text(s)
          PY

          sed -i -E 's/^version = .*/version = 1.1.0/' morphe-base/gradle.properties

      - name: Compilar MPP
        working-directory: morphe-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Guardar MPP
        uses: actions/upload-artifact@v4
        with:
          name: discord-346-camera-1080p-mpp
          path: morphe-base/patches/build/libs/*.mpp
          if-no-files-found: error
